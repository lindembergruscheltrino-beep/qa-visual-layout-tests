<!-- SCRIPTS -->
    <script>
        const GOOGLE_SCRIPT_EXPEDICAO_URL = "https://script.google.com/a/macros/whirlpool.com/s/AKfycbyYuFwrYVZqk_qESy1ZIQVeT5douMBynfPXEL_sR17LZobN_samKqeBHWIS77FjNw7Meg/exec";

        let currentData = {
            ruas: [
                { rua: "RUA 01", loc: "9/9", est: 1919 },
                { rua: "RUA 02", loc: "24/36", est: 1497 },
                { rua: "RUA 03", loc: "39/41", est: 2635 },
                { rua: "RUA 04", loc: "35/36", est: 2850 },
                { rua: "RUA 05", loc: "36/36", est: 2742 },
                { rua: "RUA 06", loc: "3/33", est: 654 }
            ],
            familias: [
                { familia: "REFRIGERADOR", area: "1.459m²", est: 6682 },
                { familia: "LAVADORA", area: "440m²", est: 1738 },
                { familia: "FOGÃO", area: "375m²", est: 909 },
                { familia: "FORNO", area: "96m²", est: 689 },
                { familia: "FREEZER", area: "88m²", est: 213 },
                { familia: "MIX / OUTROS", area: "211m²", est: 1347 }
            ],
            expedicaoResumo: {
                totalCargas: 0,
                concluidos: 0,
                emAndamento: 0,
                totalPecas: 0
            },
            cargas: []
        };

        // Função global de retorno chamada pelo JSONP do Google Apps Script
        window.receberDadosExpedicao = function(data) {
            if (data && data.status === "success") {
                if (data.resumo) {
                    currentData.expedicaoResumo.totalCargas = data.resumo.totalCargas;
                    currentData.expedicaoResumo.concluidos = data.resumo.concluidos;
                    currentData.expedicaoResumo.emAndamento = data.resumo.emAndamento || 0;
                    currentData.expedicaoResumo.totalPecas = data.resumo.totalPecas;
                }
                if (data.cargas) {
                    currentData.cargas = data.cargas;
                }

                const badge = document.querySelector('.badge-date-clean');
                if (badge && data.timestamp) {
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Atualizado às ${data.timestamp}`;
                }

                renderizarExpedicao();
            }
        };

        // Injeta a tag <script> dinamicamente para contornar qualquer barreira de CORS
        function sincronizarExpedicao() {
            const scriptExistente = document.getElementById('script-jsonp-expedicao');
            if (scriptExistente) {
                scriptExistente.remove();
            }

            const scriptTag = document.createElement('script');
            scriptTag.id = 'script-jsonp-expedicao';
            const divisor = GOOGLE_SCRIPT_EXPEDICAO_URL.includes('?') ? '&' : '?';
            scriptTag.src = GOOGLE_SCRIPT_EXPEDICAO_URL + divisor + 'callback=receberDadosExpedicao&_t=' + Date.now();
            document.body.appendChild(scriptTag);
        }

        function renderizarExpedicao() {
            const elCargas = document.getElementById('kpiTotalCargas');
            const elConcluidas = document.getElementById('kpiConcluidas');
            const elAndamento = document.getElementById('kpiAndamento');
            const elPecas = document.getElementById('kpiTotalPecas');

            if (elCargas) elCargas.innerText = currentData.expedicaoResumo.totalCargas;
            if (elConcluidas) elConcluidas.innerText = currentData.expedicaoResumo.concluidos;
            if (elAndamento) elAndamento.innerText = currentData.expedicaoResumo.emAndamento;
            if (elPecas) elPecas.innerText = currentData.expedicaoResumo.totalPecas.toLocaleString('pt-BR');

            const tbody = document.getElementById('expedicaoTableBody');
            if (tbody) {
                tbody.innerHTML = '';
                if (currentData.cargas.length === 0) {
                    tbody.innerHTML = `
                        <tr class="flex justify-center items-center py-2 text-slate-500">
                            <td>Nenhum transporte localizado para a data de hoje.</td>
                        </tr>
                    `;
                    return;
                }

                currentData.cargas.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.className = "flex justify-between items-center w-full px-2 py-0.5 border-b border-slate-800/40 text-[7.5px]";

                    let statusBadge = "text-slate-400 bg-slate-800/60";
                    const sNorm = (c.status || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    if (sNorm.includes("concluid") || sNorm.includes("finaliz")) {
                        statusBadge = "text-emerald-400 bg-emerald-500/10";
                    } else if (sNorm.includes("carreg") || sNorm.includes("separ") || sNorm.includes("confer") || sNorm.includes("apres")) {
                        statusBadge = "text-amber-400 bg-amber-500/10";
                    } else if (sNorm.includes("pendent")) {
                        statusBadge = "text-cyan-400 bg-cyan-500/10";
                    }

                    tr.innerHTML = `
                        <td class="w-2/12 font-bold text-slate-200 text-left font-mono">${c.transporte}</td>
                        <td class="w-1/12 text-center text-slate-400">${c.perfil || '-'}</td>
                        <td class="w-1/12 text-center font-bold text-blue-400 font-mono">${c.doca || '-'}</td>
                        <td class="w-2/12 text-center text-slate-300 font-mono">${c.sku || '-'} / <span class="text-cyan-400 font-bold">${c.pecas || 0}</span></td>
                        <td class="w-2/12 text-center text-slate-400 font-mono">${c.agenda || '-'}</td>
                        <td class="w-4/12 text-right">
                            <span class="px-1.5 py-0.5 rounded font-bold ${statusBadge}">${c.status}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function carregarPainel() {
            // Ruas (TV 01)
            const ruasBody = document.getElementById('ruasTableBody');
            if (ruasBody) {
                ruasBody.innerHTML = '';
                currentData.ruas.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.className = "flex justify-between items-center w-full px-1 py-0.5";
                    tr.innerHTML = `<td class="font-bold text-blue-400 text-left w-1/3">${r.rua}</td>
                                    <td class="text-slate-300 font-mono text-center w-1/3">${r.loc}</td>
                                    <td class="text-right font-bold text-emerald-400 w-1/3">${r.est.toLocaleString('pt-BR')}</td>`;
                    ruasBody.appendChild(tr);
                });
            }

            // Famílias (TV 01)
            const familyBody = document.getElementById('familyTableBody');
            const marquee = document.getElementById('tickerMarquee');
            if (familyBody && marquee) {
                familyBody.innerHTML = '';
                marquee.innerHTML = '';

                currentData.familias.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = "flex justify-between items-center w-full px-1 py-0.5";
                    tr.innerHTML = `<td class="font-bold text-slate-200 text-left w-1/3">${item.familia}</td>
                                    <td class="text-slate-300 font-mono text-center w-1/3">${item.area}</td>
                                    <td class="text-right font-bold text-blue-400 font-mono w-1/3">${item.est.toLocaleString('pt-BR')}</td>`;
                    familyBody.appendChild(tr);

                    const div = document.createElement('div');
                    div.className = "ticker__item";
                    div.innerHTML = `<span class="text-white font-black">${item.familia}</span>: <span class="text-blue-400 ml-1 font-mono">${item.est.toLocaleString('pt-BR')} un</span>`;
                    marquee.appendChild(div);
                });
            }

            renderizarExpedicao();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert("Erro: " + err.message));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarPainel();
            sincronizarExpedicao();
            // Atualiza automaticamente a cada 30 segundos
            setInterval(sincronizarExpedicao, 30000);
        });
    </script>
</body>
</html>

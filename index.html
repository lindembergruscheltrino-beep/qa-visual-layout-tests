<script>
    let fluxoChartInstance = null;
    
    // URL da API de Expedição do Google Apps Script
    const GOOGLE_SCRIPT_EXPEDICAO_URL = "https://script.google.com/a/macros/whirlpool.com/s/AKfycbyYuFwrYVZqk_qESy1ZIQVeT5douMBynfPXEL_sR17LZobN_samKqeBHWIS77FjNw7Meg/exec";

    // Estrutura de dados local com fallback padrão
    let currentData = {
        ruas: [
            { rua: "RUA 01", loc: "9/9", est: 1919 },
            { rua: "RUA 02", loc: "24/36", est: 1497 },
            { rua: "RUA 03", loc: "39/41", est: 2635 },
            { rua: "RUA 04", loc: "35/36", est: 2850 },
            { rua: "RUA 05", loc: "36/36", est: 2742 },
            { rua: "RUA 06", loc: "3/33", est: 654 }
        ],
        familias: [
            { familia: "REFRIGERADOR", area: "1.459m²", est: 6682 },
            { familia: "LAVADORA", area: "440m²", est: 1738 },
            { familia: "FOGÃO", area: "375m²", est: 909 },
            { familia: "FORNO", area: "96m²", est: 689 },
            { familia: "FREEZER", area: "88m²", est: 213 },
            { familia: "MIX / OUTROS", area: "211m²", est: 1347 }
        ],
        feedbacksPositivos: [
            "⭐ 5/5 'Entrega super rápida! O produto chegou bem antes do prazo estipulado. Excelente serviço.'",
            "⭐ 5/5 'Impressionado com a velocidade. Comprei em um dia e chegou no outro. Nota 10!'",
            "⭐ 5/5 'Entregador super educado e cordial. Um excelente atendimento na hora da entrega.'",
            "⭐ 5/5 'PERFEITA A ENTREGA !! MINHA GELADEIRA CHEGOU MUITO RÁPIDO em perfeito estado !!'"
        ],
        fluxoDiario: {
            dias: ['01', '02', '05', '06', '07', '08', '09', '10', '13', '14', '15', '16', '17', '19', '20', '21'],
            recebimento: [452, 664, 799, 173, 197, 0, 160, 598, 845, 840, 814, 839, 1318, 710, 1527, 950],
            expedicao: [288, 32, 143, 63, 1, 1969, 994, 120, 1577, 878, 587, 744, 298, 1202, 827, 56]
        },
        expedicaoResumo: {
            totalCargas: 915,
            concluidos: 786,
            bloqueados: 253
        }
    };

    // Função para buscar dados em tempo real da Expedição
    async function sincronizarExpedicao() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_EXPEDICAO_URL);
            const data = await response.json();

            if (data.status === "success" && data.resumo) {
                // Atualiza contadores com os dados vindos da planilha
                currentData.expedicaoResumo.totalCargas = data.resumo.totalCargas || currentData.expedicaoResumo.totalCargas;
                currentData.expedicaoResumo.concluidos = data.resumo.concluidos || currentData.expedicaoResumo.concluidos;
                
                // Atualiza badge de última sincronização
                const badge = document.querySelector('.badge-date-clean');
                if (badge && data.timestamp) {
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Atualizado às ${data.timestamp}`;
                }

                carregarPainel();
            }
        } catch (error) {
            console.warn("Aviso: Falha ao carregar dados remotos da Expedição (usando dados locais):", error);
        }
    }

    function carregarPainel() {
        // Atualiza números da TV 02 caso os elementos existam
        const elemProgramadas = document.querySelector('#kpiProgramadas');
        const elemConcluidas = document.querySelector('#kpiConcluidas');
        if (elemProgramadas) elemProgramadas.innerText = currentData.expedicaoResumo.totalCargas;
        if (elemConcluidas) elemConcluidas.innerText = currentData.expedicaoResumo.concluidos;

        // Ruas (TV 01)
        const ruasBody = document.getElementById('ruasTableBody');
        if (ruasBody) {
            ruasBody.innerHTML = '';
            currentData.ruas.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "flex justify-between items-center w-full px-1 py-0.5";
                tr.innerHTML = `<td class="font-bold text-blue-400 text-left w-1/3">${r.rua}</td>
                                <td class="text-slate-300 font-mono text-center w-1/3">${r.loc}</td>
                                <td class="text-right font-bold text-emerald-400 w-1/3">${r.est.toLocaleString('pt-BR')}</td>`;
                ruasBody.appendChild(tr);
            });
        }

        // Famílias (TV 01)
        const familyBody = document.getElementById('familyTableBody');
        const marquee = document.getElementById('tickerMarquee');
        if (familyBody && marquee) {
            familyBody.innerHTML = '';
            marquee.innerHTML = '';

            currentData.familias.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "flex justify-between items-center w-full px-1 py-0.5";
                tr.innerHTML = `<td class="font-bold text-slate-200 text-left w-1/3">${item.familia}</td>
                                <td class="text-slate-300 font-mono text-center w-1/3">${item.area}</td>
                                <td class="text-right font-bold text-blue-400 font-mono w-1/3">${item.est.toLocaleString('pt-BR')}</td>`;
                familyBody.appendChild(tr);

                const div = document.createElement('div');
                div.className = "ticker__item";
                div.innerHTML = `<span class="text-white font-black">${item.familia}</span>: <span class="text-blue-400 ml-1 font-mono">${item.est.toLocaleString('pt-BR')} un</span>`;
                marquee.appendChild(div);
            });
        }

        // Ticker Feedbacks (TV 02)
        const feedbackMarquee = document.getElementById('feedbackMarquee');
        if (feedbackMarquee) {
            feedbackMarquee.innerHTML = '';
            [...currentData.feedbacksPositivos, ...currentData.feedbacksPositivos].forEach(txt => {
                const div = document.createElement('div');
                div.className = "feedback-ticker__item";
                div.innerHTML = `<span class="text-emerald-400">${txt}</span><span class="text-slate-700 mx-3">|</span>`;
                feedbackMarquee.appendChild(div);
            });
        }

        renderizarGraficoFluxoDiario();
    }

    function renderizarGraficoFluxoDiario() {
        const canvas = document.getElementById('chartFluxoDiario');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (fluxoChartInstance) fluxoChartInstance.destroy();

        const gradientRec = ctx.createLinearGradient(0, 0, 0, 80);
        gradientRec.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
        gradientRec.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        const gradientExp = ctx.createLinearGradient(0, 0, 0, 80);
        gradientExp.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
        gradientExp.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        fluxoChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: currentData.fluxoDiario.dias,
                datasets: [
                    {
                        label: 'Inbound',
                        data: currentData.fluxoDiario.recebimento,
                        borderColor: '#10b981',
                        backgroundColor: gradientRec,
                        borderWidth: 1.5,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 1.5
                    },
                    {
                        label: 'Outbound',
                        data: currentData.fluxoDiario.expedicao,
                        borderColor: '#06b6d4',
                        backgroundColor: gradientExp,
                        borderWidth: 1.5,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 1.5
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, datalabels: { display: false } },
                scales: {
                    x: { ticks: { color: '#64748b', font: { size: 6 } }, grid: { display: false } },
                    y: { display: false }
                }
            }
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => alert("Erro: " + err.message));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        carregarPainel();
        sincronizarExpedicao();
        
        // Atualiza os dados da planilha a cada 30 segundos
        setInterval(sincronizarExpedicao, 30000);
    });
</script>
